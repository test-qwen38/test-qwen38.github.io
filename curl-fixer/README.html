<p>Инструмент для чистки curl-команд из PowerShell/CMD: раскрывает экранирование каретой (<code>^X</code> → <code>X</code>, <code>^^</code> → <code>^</code>) и убирает все оставшиеся символы <code>^</code>. Вставить команду → получить готовый запрос (можно скопировать). Один файл (HTML/CSS/JS).</p>
