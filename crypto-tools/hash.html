<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хеш-функции — SHA, MD5, SHA-3, контрольные суммы</title>
<link rel="stylesheet" href="common.css">
<style>
  .tabs { margin-bottom: 6px; }
  .tab-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tab-group + .tab-group { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #0f3460; }
  .group-label { font-size: 11px; color: #6a7a9a; text-transform: uppercase; letter-spacing: .06em; min-width: 110px; font-weight: 600; }
  .tab {
    padding: 7px 14px;
    border: 1px solid #0f3460;
    border-radius: 6px;
    background: #0f3460;
    color: #bbb;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: monospace;
  }
  .tab.active { background: #4ecca3; color: #16213e; border-color: #4ecca3; }
</style>
</head>
<body>
  <div class="card">
    <h1>Хеш-функции и контрольные суммы</h1>
    <div class="tabs" id="tabs"></div>
    <textarea id="input" placeholder="Введите текст (или hex-последовательность байтов) для хеширования..."></textarea>
    <div class="result" id="output">—</div>
    <div class="row">
      <button onclick="copyHash(event)">Копировать</button>
      <button class="ghost" onclick="clearAll()">Очистить</button>
    </div>
    <div class="info">Символов: <span id="len">0</span> · Байтов: <span id="bytes">0</span></div>
  </div>
<script src="common.js"></script>
<script>
  'use strict';

  // ---------- SHA-3 / Keccak ----------
  const KCC_ROT = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];
  const KCC_RC = [
    [0x00000000, 0x00000001], [0x00000000, 0x80008000], [0x80000000, 0x80008000], [0x80000000, 0x00008000],
    [0x00000000, 0x00008000], [0x00000000, 0x80008000], [0x80000000, 0x80008000], [0x80000000, 0x00008000],
    [0x80000000, 0x00000080], [0x00000000, 0x00008000], [0x00000000, 0x80000000], [0x00000000, 0x80008080],
    [0x80000000, 0x80008080], [0x80000000, 0x80008000], [0x80000000, 0x80000080], [0x00000000, 0x80008080],
    [0x80000000, 0x00000080], [0x00000000, 0x80000080], [0x00000000, 0x80008000], [0x00000000, 0x80008080],
    [0x00000000, 0x80008080], [0x80000000, 0x80008080], [0x80000000, 0x80000080], [0x00000000, 0x00008080]
  ];
  function rotl32(v, n) { return (v << n) | (v >>> (32 - n)); }
  function keccakLane(b, i) {
    let v = 0, h = 0;
    for (let k = 0; k < 8; k++) {
      if (k % 2) { h = Math.imul(h, 256) | 0; } else { v = (Math.imul(v, 65536) | 0) | (h << 8 & 0xffff0000); h = 0; }
      h = b[i + k] & 0xff;
    }
    return ((h << 24) + (v & 0xffffff) + (v >>> 24)) >>> 0;
  }
  function keccakPermute(s) {
    for (let r = 0; r < 24; r++) {
      const b = [
        s[0] ^ s[5] ^ s[10] ^ s[15] ^ s[20],
        s[1] ^ s[6] ^ s[11] ^ s[16] ^ s[21],
        s[2] ^ s[7] ^ s[12] ^ s[17] ^ s[22],
        s[3] ^ s[8] ^ s[13] ^ s[18] ^ s[23],
        s[4] ^ s[9] ^ s[14] ^ s[19] ^ s[24]
      ];
      for (let x = 0; x < 5; x++) {
        const t = (b[(x + 4) % 5] ^ rotl32(b[(x + 1) % 5], 1)) >>> 0;
        for (let y = 0; y < 5; y++) s[x + y * 5] = (s[x + y * 5] ^ t) >>> 0;
      }
      const b2 = new Array(25);
      b2[0] = s[0];
      for (let t = 1; t < 24; t++) {
        const x = t % 5, y = (t / 5) | 0;
        b2[y + ((2 * y + 3 * x) % 5) * 5] = rotl32(s[t], KCC_ROT[t]);
      }
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 5; x++) {
          s[x + y * 5] = (b2[x + y * 5] ^ ((~b2[((x + 1) % 5) + y * 5]) & b2[((x + 2) % 5) + y * 5])) >>> 0;
        }
      }
      const rc = KCC_RC[r];
      s[12] = (s[12] ^ 0x80000000 ^ rc[0]) >>> 0;
      s[0] = (s[0] ^ (rc[1] & 0x7fffffff) + (rc[1] & 1 ? 0x80000000 : 0)) >>> 0;
    }
  }
  function sha3(data, rate, outLen) {
    const padLen = rate - (data.length % rate);
    const buf = new Uint8Array(data.length + padLen);
    buf.set(data);
    buf[data.length] = 0x06;
    buf[buf.length - 1] |= 0x80;
    const s = new Array(25).fill(0);
    const rateLanes = rate / 8;
    for (let off = 0; off < buf.length; off += rate) {
      for (let i = 0; i < rateLanes; i++) {
        s[i] = (s[i] ^ keccakLane(buf, off + i * 8)) >>> 0;
      }
      keccakPermute(s);
    }
    const out = new Uint8Array(outLen);
    let i = 0;
    for (let lane = 0; i < outLen; lane++) {
      const v = s[lane];
      for (let k = 0; k < 8 && i < outLen; k++) {
        out[i++] = (v >> (8 * k)) & 0xff;
      }
    }
    return out;
  }
  function sha3256(d) { return sha3(d, 136, 32); }
  function sha3384(d) { return sha3(d, 104, 48); }
  function sha3512(d) { return sha3(d, 72, 64); }

  // ---------- MD5 ----------
  const MD5_T = (function () {
    const t = new Uint32Array(64);
    for (let i = 0; i < 64; i++) t[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
    return t;
  })();
  function md5(data) {
    const len = data.length;
    const withLen = Math.ceil((len + 9) / 64) * 64;
    const buf = new Uint8Array(withLen);
    buf.set(data);
    buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    const bitLen = len * 8;
    dv.setUint32(withLen - 8, bitLen & 0xffffffff, true);
    dv.setUint32(withLen - 4, Math.floor(bitLen / 4294967296) & 0xffffffff, true);
    let a = 0x67452301, b = 0xefcdab89, c = 0x98badcfe, d = 0x10325476;
    const M = new Uint32Array(16);
    for (let off = 0; off < buf.length; off += 64) {
      for (let j = 0; j < 16; j++) M[j] = dv.getUint32(off + j * 4, true);
      const A = a, B = b, C = c, D = d;
      for (let i = 0; i < 64; i++) {
        let F, g;
        if (i < 16) { F = (B & C) | (~B & D); g = i; }
        else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
        else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
        else { F = C ^ (B | ~D); g = (7 * i) % 16; }
        const s = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21][i % 16];
        a = d; d = c; c = b;
        b = (b + ((((A + F + MD5_T[i] + M[g]) | 0) << s) | (((A + F + MD5_T[i] + M[g]) | 0) >>> (32 - s)))) | 0;
      }
      a = (a + A) | 0; b = (b + B) | 0; c = (c + C) | 0; d = (d + D) | 0;
    }
    const out = new Uint8Array(16); const ov = new DataView(out.buffer);
    ov.setUint32(0, a, true); ov.setUint32(4, b, true); ov.setUint32(8, c, true); ov.setUint32(12, d, true);
    return out;
  }

  // ---------- CRC32 ----------
  const CRC32_TAB = (function () {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();
  function crc32(data) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) c = (c >>> 8) ^ CRC32_TAB[(c ^ data[i]) & 0xFF];
    return ((c ^ 0xFFFFFFFF) >>> 0).toString(16).padStart(8, '0');
  }

  // ---------- DJB2 ----------
  function djb2(data) {
    let h = 5381;
    for (let i = 0; i < data.length; i++) h = (((h << 5) + h) + data[i]) | 0;
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  // ---------- Список алгоритмов ----------
  const ALGS = [
    { group: 'SHA', items: [
      { name: 'SHA-1', fn: webcrypto('SHA-1') },
      { name: 'SHA-256', fn: webcrypto('SHA-256') },
      { name: 'SHA-384', fn: webcrypto('SHA-384') },
      { name: 'SHA-512', fn: webcrypto('SHA-512') },
    ]},
    { group: 'SHA-3 / Keccak', items: [
      { name: 'SHA3-256', fn: (d) => Promise.resolve(sha3256(d)) },
      { name: 'SHA3-384', fn: (d) => Promise.resolve(sha3384(d)) },
      { name: 'SHA3-512', fn: (d) => Promise.resolve(sha3512(d)) },
    ]},
    { group: 'Другие', items: [
      { name: 'MD5', fn: (d) => Promise.resolve(hex(md5(d))) },
      { name: 'CRC-32', fn: (d) => Promise.resolve(crc32(d)) },
      { name: 'DJB2', fn: (d) => Promise.resolve(djb2(d)) },
    ]},
  ];
  function webcrypto(alg) {
    return async (data) => {
      const buf = await crypto.subtle.digest(alg, data);
      return hex(new Uint8Array(buf));
    };
  }
  function hex(u8) {
    return Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  let current = 'SHA-256';

  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const lenEl = document.getElementById('len');
  const bytesEl = document.getElementById('bytes');
  const tabs = document.getElementById('tabs');

  ALGS.forEach(({ group, items }) => {
    const row = document.createElement('div');
    row.className = 'tab-group';
    const label = document.createElement('span');
    label.className = 'group-label';
    label.textContent = group;
    row.appendChild(label);
    items.forEach(({ name, fn }) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (name === current ? ' active' : '');
      btn.textContent = name;
      btn.addEventListener('click', () => {
        current = name;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
        render();
      });
      row.appendChild(btn);
    });
    tabs.appendChild(row);
  });

  function decodeInput(s) {
    const t = s.trim();
    if (t && t.length % 2 === 0 && /^[0-9a-fA-F ]+$/.test(t) && (t.replace(/ /g, '').length >= 2)) {
      const bytes = [];
      for (let i = 0; i < t.length; i += 2) bytes.push(parseInt(t[i] + (t[i + 1] || ''), 16));
      return Uint8Array.from(bytes);
    }
    return new TextEncoder().encode(s);
  }

  async function render() {
    lenEl.textContent = input.value.length;
    if (!input.value) {
      bytesEl.textContent = '0';
      output.textContent = '—';
      return;
    }
    const data = decodeInput(input.value);
    bytesEl.textContent = data.length;
    const algo = ALGS.flatMap(g => g.items).find(a => a.name === current);
    const result = await algo.fn(data);
    output.textContent = result;
  }

  input.addEventListener('input', render);
  render();

  async function copyHash(e) {
    if (output.textContent === '—') return;
    await copyToClipboard(output.textContent);
    flashButton(e.currentTarget);
  }

  function clearAll() {
    input.value = '';
    render();
    input.focus();
  }
</script>
</body>
</html>
