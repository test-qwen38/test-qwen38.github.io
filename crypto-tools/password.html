<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор паролей</title>
<link rel="stylesheet" href="common.css">
<style>
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 16px 0; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ddd; cursor: pointer; user-select: none; }
  .opt input { accent-color: #4ecca3; width: 16px; height: 16px; cursor: pointer; }
  .opt .set { font-size: 11px; color: #666; font-family: monospace; }
  .len-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .len-row input[type=range] { flex: 1; accent-color: #4ecca3; }
  .len-row input[type=number] {
    width: 70px; padding: 8px; border-radius: 6px;
    border: 1px solid #0f3460; background: #0f3460; color: #eee;
    font-size: 16px; font-weight: 600; outline: none; text-align: center;
  }
  .len-row input[type=number]:focus { border-color: #4ecca3; }
  .strength { margin-top: 14px; }
  .strength .bar { height: 6px; border-radius: 3px; background: #0f3460; overflow: hidden; }
  .strength .fill { height: 100%; width: 0; border-radius: 3px; background: #e94560; transition: width .2s, background .2s; }
  .strength .label { font-size: 12px; color: #888; margin-top: 6px; }
  .pw { font-size: 18px !important; letter-spacing: 1px; padding: 14px 16px !important; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Генератор паролей</h1>

    <div class="result pw" id="output">—</div>

    <div class="strength">
      <div class="bar"><div class="fill" id="strength-fill"></div></div>
      <div class="label" id="strength-label">—</div>
    </div>

    <label>Длина пароля: <b id="len-value">10</b></label>
    <div class="len-row">
      <input type="range" id="len-range" min="4" max="128" value="10">
      <input type="number" id="len-input" min="4" max="128" value="10">
    </div>

    <div class="options">
      <label class="opt"><input type="checkbox" id="lower" checked>
        <span>Строчные латинские</span><span class="set">a–z</span></label>
      <label class="opt"><input type="checkbox" id="upper" checked>
        <span>Заглавные латинские</span><span class="set">A–Z</span></label>
      <label class="opt"><input type="checkbox" id="digits" checked>
        <span>Цифры</span><span class="set">0–9</span></label>
      <label class="opt"><input type="checkbox" id="special" checked>
        <span>Спецсимволы</span><span class="set">!@#$%^&amp;*…</span></label>
    </div>

    <div class="row">
      <button onclick="regenerate()">Сгенерировать</button>
      <button class="ghost" onclick="copyPassword(event)">Копировать</button>
    </div>

    <div class="info">Пароль всегда содержит хотя бы по одному символу из каждого выбранного набора. Генерация использует <code>crypto.getRandomValues()</code>.</div>
  </div>
<script src="common.js"></script>
<script>
  const SETS = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    digits: '0123456789',
    special: '!@#$%^&*()-_=+[]{};:,.<>?/'
  };

  const output = document.getElementById('output');
  const lenRange = document.getElementById('len-range');
  const lenInput = document.getElementById('len-input');
  const lenValue = document.getElementById('len-value');
  const strengthFill = document.getElementById('strength-fill');
  const strengthLabel = document.getElementById('strength-label');
  const boxes = ['lower', 'upper', 'digits', 'special'].map(id => document.getElementById(id));

  function selectedSets() {
    return ['lower', 'upper', 'digits', 'special'].filter(id => document.getElementById(id).checked);
  }

  function pool() {
    return selectedSets().map(id => SETS[id]).join('');
  }

  function randomInt(max) {
    const limit = 0x100000000 - (0x100000000 % max);
    const buf = new Uint32Array(1);
    let x;
    do {
      crypto.getRandomValues(buf);
      x = buf[0];
    } while (x >= limit);
    return x % max;
  }

  function generate() {
    const ids = selectedSets();
    const len = parseInt(lenInput.value, 10);
    if (!ids.length || !len) return '';
    const all = pool();
    const chars = ids.map(id => SETS[id][randomInt(SETS[id].length)]);
    for (let i = chars.length; i < len; i++) chars.push(all[randomInt(all.length)]);
    const arr = new Uint32Array(chars.map(c => c.charCodeAt(0)));
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return Array.from(arr, c => String.fromCharCode(c)).join('');
  }

  function updateStrength(pw) {
    const p = pool();
    if (!p.length) {
      strengthFill.style.width = '0';
      strengthLabel.textContent = 'Выберите хотя бы один набор символов';
      return;
    }
    const entropy = pw.length * Math.log2(p.length);
    let pct, color, label;
    if (entropy < 40) { pct = 20; color = '#e94560'; label = 'слабый'; }
    else if (entropy < 70) { pct = 50; color = '#f5a623'; label = 'средний'; }
    else if (entropy < 100) { pct = 78; color = '#4ecca3'; label = 'хороший'; }
    else { pct = 100; color = '#4ecca3'; label = 'отличный'; }
    strengthFill.style.width = pct + '%';
    strengthFill.style.background = color;
    strengthLabel.textContent = `Энтропия ≈ ${Math.round(entropy)} бит — ${label}`;
  }

  let regenerate = function() {
    const pw = generate();
    output.textContent = pw || '—';
    updateStrength(pw);
  };

  function syncLen(v) {
    v = Math.min(128, Math.max(4, parseInt(v, 10) || 10));
    lenRange.value = v;
    lenInput.value = v;
    lenValue.textContent = v;
  }

  let timer;
  function regenerateDebounced() {
    clearTimeout(timer);
    timer = setTimeout(regenerate, 200);
  }

  lenRange.addEventListener('input', () => { syncLen(lenRange.value); regenerate(); });
  lenInput.addEventListener('input', () => { syncLen(lenInput.value); regenerateDebounced(); });
  boxes.forEach(b => b.addEventListener('change', () => {
    if (!selectedSets().length) {
      b.checked = true;
      return;
    }
    regenerate();
  }));

  async function copyPassword(e) {
    if (output.textContent === '—') return;
    await copyToClipboard(output.textContent);
    flashButton(e.currentTarget);
  }

  regenerate();
</script>
</body>
</html>
