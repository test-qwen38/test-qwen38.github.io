<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
    <!-- Header -->
    <div class="header">
        <h1>✦ Мои задачи</h1>
        <p id="dateDisplay"></p>
    </div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off">
        <button class="btn-add" id="btnAdd" title="Добавить задачу">+</button>
    </div>

    <!-- Priority + Stats -->
    <div class="input-row">
        <select id="prioritySelect">
            <option value="low">🟢 Низкий приоритет</option>
            <option value="medium" selected>🟡 Средний приоритет</option>
            <option value="high">🔴 Высокий приоритет</option>
        </select>
        <div class="stats-bar">
            <div class="stat"><span class="stat-dot active"></span> <span id="activeCount">0</span> активных</div>
            <div class="stat"><span class="stat-dot done"></span> <span id="doneCount">0</span> выполнено</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="completed">Выполненные</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskList"></div>

    <!-- Footer -->
    <div class="footer" id="footer" style="display: none;">
        <span class="footer-info" id="footerInfo"></span>
        <button class="btn-clear" id="btnClear">Очистить выполненные</button>
    </div>
</div>

<script src="storageAdapter.js"></script>
<script src="taskService.js"></script>
<script src="app.js"></script>

</body>
</html>
