<p>Список задач «Мои задачи»: добавление задач с приоритетом, отметка выполнения, фильтры (все / активные / выполненные), удаление отдельных задач и очистка выполненных. Данные хранятся в <code>localStorage</code>. Vanilla JS, файлов: <code>index.html</code>, <code>app.js</code>, <code>taskService.js</code>, <code>storageAdapter.js</code>, <code>styles.css</code>.</p>
