<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test qwen3.8 27b q5</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
  .spoiler-arrow {
    font-size: 14px;
    color: #6c757d;
    line-height: 1;
    padding: 0 4px;
    background: none;
    border: none;
  }
  .spoiler-arrow:hover { color: #000; }
  .spoiler-title {
    background: none;
    border: none;
    padding: 0;
    width: 100%;
    text-align: left;
  }
  .spoiler-title a {
    color: inherit;
    text-decoration: none;
  }
  .spoiler-title a:hover { text-decoration: underline; }
  .spoiler-title .arrow {
    color: #6c757d;
    margin-left: 4px;
  }
  .spoiler-title .arrow:hover { color: #000; }
  .spoiler-body { margin-top: 6px; font-size: 12px; line-height: 1.4; }
  .spoiler-body a { color: #0d6efd; }
  .spoiler-status { color: #6c757d; }
</style>
</head>
<body>

<div class="col-lg-8 mx-auto p-3 py-md-5">
  <header class="d-flex align-items-center pb-3">
    <a href="/" class="d-flex align-items-center text-dark text-decoration-none">
      <h1 class="fs-4">Test qwen3.8 27b q5</h1>
    </a>
  </header>

  <p class="text-muted small mb-4">Все проекты на этой странице сгенерированы с помощью <a href="https://opencode.ai" target="_blank" rel="noopener">opencode</a> и модели <a href="https://ollama.com/library/qwen3.8" target="_blank" rel="noopener">qwen3.8 27b</a>.</p>

  <main>
    <div class="list-group" id="projects">
      <template id="project-template">
        <div class="list-group-item">
          <h6 class="mb-0">
            <button type="button" class="spoiler-title">
              <a target="_blank"></a>
              <span class="arrow">&#9654;</span>
            </button>
          </h6>
          <div class="spoiler-body" hidden></div>
        </div>
      </template>
    </div>
  </main>
  <footer class="pt-5 my-5 text-muted border-top">
    Created by <a href="https://ollama.com/library/qwen3.8">qwen3.8</a> &middot; &copy; 2026
  </footer>
</div>
<script>
  var PROJECTS = [
    { name: 'Рыбки в аквариуме', href: 'aquarium/index.html', readme: 'aquarium/README.html' },
    { name: 'Анимация машины', href: 'car-animation/index.html', readme: 'car-animation/README.html' },
    { name: 'Крипто-инструменты', href: 'crypto-tools/index.html', readme: 'crypto-tools/README.html' },
    { name: 'Лэндинг для продажи огурцов', href: 'cucumber-landing/index.html', readme: 'cucumber-landing/README.html' },
    { name: 'Фиксер CURL-запросов', href: 'curl-fixer/index.html', readme: 'curl-fixer/README.html' },
    { name: 'Каталог фильмов', href: 'film-catalog/index.html', readme: 'film-catalog/README.html' },
    { name: 'DOOM 3 — браузерная FPS', href: 'doom-3/index.html', readme: 'doom-3/README.html' },
    { name: 'Танцующий хомяк', href: 'hamster-dance/index.html', readme: 'hamster-dance/README.html' },
    { name: 'Электронный магазин', href: 'shop/categories/index.html', readme: 'shop/README.html' },
    { name: 'Список задач', href: 'todo/index.html', readme: 'todo/README.html' }
  ];

  var projectsEl = document.getElementById('projects');
  var template = document.getElementById('project-template');

  PROJECTS.forEach(function (project) {
    var node = template.content.firstElementChild.cloneNode(true);
    var title = node.querySelector('.spoiler-title');
    var link = title.querySelector('a');
    var arrow = title.querySelector('.arrow');
    var body = node.querySelector('.spoiler-body');

    link.textContent = project.name;
    link.setAttribute('href', project.href);
    link.setAttribute('target', '_blank');

    arrow.addEventListener('click', function () {
      if (body.hidden) {
        fetch(project.readme).then(function (resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.text();
        }).then(function (html) {
          body.innerHTML = html;
          body.hidden = false;
          arrow.innerHTML = '&#9660;';
        }).catch(function () {
          body.innerHTML = '<span class="spoiler-status">Не удалось загрузить описание (README.html)</span>';
          body.hidden = false;
          arrow.innerHTML = '&#9660;';
        });
      } else {
        body.hidden = true;
        arrow.innerHTML = '&#9654;';
      }
    });

    projectsEl.appendChild(node);
  });
</script>
</body>
</html>
