<script>
  document.querySelectorAll('.list-group-item').forEach(function (item) {
    var body = item.querySelector('.spoiler-body');
    var small = body ? body.querySelector('small') : null;
    if (!small || !small.textContent.trim()) {
      var btn = item.querySelector('.spoiler-arrow');
      if (btn) btn.remove();
    }
  });
  document.querySelectorAll('.spoiler-arrow').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = btn.closest('.list-group-item');
      var body = item.querySelector('.spoiler-body');
      var open = body.hidden;
      body.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.innerHTML = open ? '&#9660;' : '&#9654;';
    });
  });
</script>
