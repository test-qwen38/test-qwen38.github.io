<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конвертер JSON Unicode</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 24px;
    color: #1f2937;
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 32px;
  }
  h1 { font-size: 24px; margin-bottom: 10px; }
  h1 code {
    background: #eef2ff; color: #4338ca;
    padding: 2px 8px; border-radius: 6px;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    font-size: 16px;
  }
  .subtitle { color: #6b7280; margin-bottom: 24px; line-height: 1.5; font-size: 14px; }
  .subtitle code {
    background: #f3f4f6; padding: 1px 5px; border-radius: 4px;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    font-size: 12px;
  }
  .panel { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    background: #f9fafb;
    color: #111827;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }
  textarea:focus {
    outline: none; border-color: #6366f1; background: #fff;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  button {
    padding: 10px 18px;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .05s, background .15s;
  }
  button:active { transform: translateY(1px); }
  #escapeBtn    { background: #4f46e5; color: #fff; }
  #escapeBtn:hover    { background: #4338ca; }
  #unescapeBtn { background: #0ea5e9; color: #fff; }
  #unescapeBtn:hover { background: #0284c7; }
  #copyBtn     { background: #059669; color: #fff; }
  #copyBtn:hover     { background: #047857; }
  #clearBtn    { background: #f3f4f6; color: #6b7280; }
  #clearBtn:hover    { background: #e5e7eb; }
  .options { display: flex; gap: 10px; margin-bottom: 16px; }
  .options label {
    display: flex; align-items: center; gap: 6px; margin: 0;
    font-weight: 500; font-size: 13px; cursor: pointer;
    padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    background: #f9fafb;
  }
  .options input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
  #stats { margin-top: 8px; font-size: 13px; color: #6b7280; min-height: 18px; }
  #stats.ok { color: #059669; font-weight: 600; }
  #stats.err { color: #dc2626; font-weight: 600; }
</style>
</head>
<body>
  <div class="container">
    <h1>Конвертер JSON <code>unicode</code> escapes</h1>
    <p class="subtitle">
      Двусторонняя конвертация: «Эскейпить» заменит все не-ASCII-символы на <code>\uXXXX</code>,
      «Расэскейпить» вернёт <code>\uXXXX</code> (и другие JSON-эскейпы) обратно в обычные символы.
    </p>

    <div class="panel">
      <label for="input">Входной текст</label>
      <textarea id="input" spellcheck="false" placeholder='Вставьте JSON или текс&shy;t...&#10;Например: {"name": "\u041f\u0440\u0438\u0432\u0435\u0442"}'></textarea>
    </div>

    <div class="options">
      <label><input type="checkbox" id="prettyCheck"> Pretty-print JSON (в «Расэскейпить»)</label>
    </div>

    <div class="actions">
      <button id="escapeBtn">Эскейпить → \uXXXX</button>
      <button id="unescapeBtn">\uXXXX → символы</button>
      <button id="copyBtn">Копировать</button>
      <button id="clearBtn">Сбросить</button>
    </div>

    <div class="panel">
      <label for="output">Результат</label>
      <textarea id="output" readonly spellcheck="false" placeholder="Здесь появится результат..."></textarea>
      <div id="stats"></div>
    </div>
  </div>

<script>
  const input  = document.getElementById('input');
  const output = document.getElementById('output');
  const stats  = document.getElementById('stats');
  const prettyCheck = document.getElementById('prettyCheck');

  // Если результат — валидный JSON, форматируем читаемо (2 пробела)
  function maybePretty(text) {
    if (!prettyCheck.checked || !text) return text;
    try {
      return JSON.stringify(JSON.parse(text), null, 2);
    } catch (e) {
      return text;
    }
  }

  function setStats(message, ok) {
    stats.textContent = message;
    stats.className = ok ? 'ok' : (message ? 'err' : '');
  }

  // Заменяем все не-ASCII-символы на \uXXXX (surrogate pairs сохраняются как пара)
  function toUnicodeEscapes(text) {
    let result = '';
    let count = 0;
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      if (code > 127) {
        result += '\\u' + code.toString(16).padStart(4, '0');
        count++;
      } else {
        result += text[i];
      }
    }
    return { text: result, count };
  }

  // Разворачиваем JSON-эскейпы: \uXXXX, \/, \b, \f, \n, \r, \t, \\
  // Работаем посимвольно, чтобы НЕ трогать неизвестные комбинации (например, \d).
  function fromUnicodeEscapes(text) {
    const simple = { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', '"': '"', '/': '/', '\\': '\\' };
    let result = '';
    let count = 0;
    let i = 0;
    while (i < text.length) {
      if (text[i] === '\\' && i + 1 < text.length) {
        const next = text[i + 1];
        if (next === 'u' && i + 5 < text.length) {
          const hex = text.slice(i + 2, i + 6);
          if (/^[0-9a-fA-F]{4}$/.test(hex)) {
            let code = parseInt(hex, 16);
            // Surrogate pair: \uD83D\uDE00 -> одно символ
            if (code >= 0xD800 && code <= 0xDBFF && text[i + 6] === '\\' && text[i + 7] === 'u') {
              const lowHex = text.slice(i + 8, i + 12);
              if (/^[0-9a-fA-F]{4}$/.test(lowHex)) {
                const low = parseInt(lowHex, 16);
                if (low >= 0xDC00 && low <= 0xDFFF) {
                  result += String.fromCharCode(code, low);
                  i += 12;
                  count += 2;
                  continue;
                }
              }
            }
            result += String.fromCharCode(code);
            i += 6;
            count++;
            continue;
          }
        } else if (next in simple) {
          result += simple[next];
          i += 2;
          count++;
          continue;
        }
      }
      result += text[i];
      i++;
    }
    return { text: result, count };
  }

  document.getElementById('escapeBtn').addEventListener('click', function () {
    const { text, count } = toUnicodeEscapes(input.value);
    output.value = maybePretty(text);
    setStats('Заменено символов в \\uXXXX: ' + count, true);
  });

  document.getElementById('unescapeBtn').addEventListener('click', function () {
    const { text, count } = fromUnicodeEscapes(input.value);
    output.value = maybePretty(text);
    setStats('Развёрнуто эскейпов: ' + count, true);
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    const value = output.value;
    if (!value) { setStats('Нечего копировать', false); return; }
    navigator.clipboard.writeText(value).then(function () {
      setStats('Скопировано в буфер обмена', true);
    }).catch(function () {
      output.select();
      document.execCommand('copy');
      setStats('Скопировано в буфер обмена', true);
    });
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    input.value = '';
    output.value = '';
    setStats('');
  });

  input.addEventListener('input', function () { setStats(''); });
</script>
</body>
</html>
