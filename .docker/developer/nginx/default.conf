server {
    listen 80;
    server_name localhost;

    root /var/www/app;
    index index.html;

    client_max_body_size 128m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2)$ {
        expires 7d;
        access_log off;
    }
}
