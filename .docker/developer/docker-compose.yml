version: "3.3"
services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "64600:80"
    volumes:
      - ../../:/var/www/app:ro
    networks:
      - network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  network:
    driver: bridge
    # Зафиксированная подсеть (обход сломанного Docker IPAM-аллокатора на хосте:
    # автоподбор подсети падает ошибкой "could not find an available, non-overlapping IPv4 address pool").
    ipam:
      config:
        - subnet: 172.30.33.0/24
          gateway: 172.30.33.1